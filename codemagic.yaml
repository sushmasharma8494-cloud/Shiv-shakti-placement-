workflows:
  android-debug:
    name: Shiv Shakti Placement APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Unpack Android project
        script: |
          rm -rf project
          mkdir -p project
          unzip -q Shiv_Shakti_Placement_Online_Build.zip -d temp cp -R temp/Project/ShivShaktiPlacementLogin/. project/rm -rf temp
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/project/local.properties"
          echo "android.useAndroidX=true" > "$CM_BUILD_DIR/project/gradle.properties"

      - name: Fix Java and Kotlin target
        script: |
          python3 -c 'p="$CM_BUILD_DIR/project/app/build.gradle.kts";s=open(p).read();s=s.replace("compileSdk = 35","compileSdk = 35\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }",1);open(p,"w").write(s)'

      - name: Install Gradle 8.11.1
        script: |
          cd "$CM_BUILD_DIR"
          curl -L --fail --silent --show-error https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build Android debug APK
        script: |
          cd "$CM_BUILD_DIR/project"
          "$CM_BUILD_DIR/gradle-8.11.1/bin/gradle" assembleDebug --no-daemon

    artifacts:
      - project/app/build/outputs/apk/debug/*.apk
