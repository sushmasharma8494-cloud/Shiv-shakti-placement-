workflows:
  android-debug:
    name: Shiv Shakti Placement APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Unpack Android project
        script: |
          rm -rf project
          mkdir -p project
          unzip -q Shiv_Shakti_Placement_Online_Build.zip -d project

      - name: Set Android SDK and AndroidX
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/project/local.properties"
          touch "$CM_BUILD_DIR/project/gradle.properties"
          echo "android.useAndroidX=true" >> "$CM_BUILD_DIR/project/gradle.properties"
          echo "android.enableJetifier=true" >> "$CM_BUILD_DIR/project/gradle.properties"

      - name: Fix Java and Kotlin target
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("$CM_BUILD_DIR/project/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          if 'compileOptions' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
                  1
              )

          p.write_text(s)
          print("Updated:", p)
          PY

      - name: Install Gradle 8.11.1
        script: |
          cd "$CM_BUILD_DIR"
          curl -L --fail --silent --show-error https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o gradle.zip
          rm -rf gradle-8.11.1
          unzip -q gradle.zip

      - name: Build Android debug APK
        script: |
          cd "$CM_BUILD_DIR/project"
          "$CM_BUILD_DIR/gradle-8.11.1/bin/gradle" assembleDebug --no-daemon

    artifacts:
      - project/app/build/outputs/apk/debug/*.apk
